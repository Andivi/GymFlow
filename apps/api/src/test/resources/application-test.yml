# Tests run against a real PostgreSQL: infra/compose.yaml locally, a service container in CI.
spring:
  datasource:
    url: ${GYMFLOW_CONTROL_DB_URL:jdbc:postgresql://localhost:5432/gymflow_control}
    username: ${GYMFLOW_CONTROL_DB_USERNAME:gymflow}
    password: ${GYMFLOW_CONTROL_DB_PASSWORD:gymflow}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

gymflow:
  test:
    tenant-db-name: gymflow_tenant_test
