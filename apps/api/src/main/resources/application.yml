spring:
  application:
    name: gymflow-api
  datasource:
    # Control-plane database. Tenant databases are resolved per gym at runtime.
    url: ${GYMFLOW_CONTROL_DB_URL}
    username: ${GYMFLOW_CONTROL_DB_USERNAME}
    password: ${GYMFLOW_CONTROL_DB_PASSWORD}
    hikari:
      pool-name: control-plane
      maximum-pool-size: ${GYMFLOW_CONTROL_DB_POOL_SIZE:10}

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

gymflow:
  migrations:
    control:
      run-on-startup: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  # Off unless explicitly enabled; local, test and compose environments turn it on.
  api-docs:
    enabled: ${GYMFLOW_API_DOCS_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${GYMFLOW_API_DOCS_ENABLED:false}
    path: /swagger-ui.html
