# Local development defaults, matching infra/compose.yaml. Never use these outside a laptop.
spring:
  datasource:
    url: ${GYMFLOW_CONTROL_DB_URL:jdbc:postgresql://localhost:5432/gymflow_control}
    username: ${GYMFLOW_CONTROL_DB_USERNAME:gymflow}
    password: ${GYMFLOW_CONTROL_DB_PASSWORD:gymflow}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
